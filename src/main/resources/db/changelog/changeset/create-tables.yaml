databaseChangeLog:
  - changeSet:
      id: 1
      author: roman
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: varchar(255)

        - createTable:
            tableName: ads
            columns:
              - column:
                  name: pk
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: image
                  type: varchar(255)
              - column:
                  name: author_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ad_author
                    references: users(id)

        - createTable:
            tableName: comments
            columns:
              - column:
                  name: pk
                  type: serial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comment_author
                    references: users(id)
              - column:
                  name: ad_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_comment_ad
                    references: ads(pk)